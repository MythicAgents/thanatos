[workspace]
members = ["shared"]

[package]
name = "thanatos"
version = "0.1.15"
authors = ["Matt Ehrnschwender (@M_alphaaa)"]
edition = "2024"
rust-version = "1.96"


[profile.release]
strip = "symbols"

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
cfg-if = "1.0"
chrono = "0.4"
hmac = "0.13.0"
path-clean = "1.0.1"
rand = "0.10.3"
serde_json = "1.0"
sha2 = "0.11.1"
netstat2 = "0.11.1"

[dependencies.openssl]
version = "0.10.45"
features = ["vendored"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.ssh2]
version = "0.9.3"
features = ["vendored-openssl"]

[dependencies.tokio]
version = "1.16.1"
features = ["net", "rt-multi-thread", "io-util", "macros", "process"]

[dependencies.ureq]
version = "3.5.0"
features = ["platform-verifier"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-acl = "0.3.0"
wmi = "0.18.4"
windows-strings = "0.5.1"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_WindowsProgramming",
]
